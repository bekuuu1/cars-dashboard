<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>CarScope 🚘 — Interactive Vehicle Data Analytics</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.css"
    />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0B1220;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .loading-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #E2E8F0;
        background: #0B1220;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #1E293B;
        border-top: 4px solid #0284C7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .title {
        font-size: 24px;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 14px;
        color: #94A3B8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-splash">
        <div class="spinner"></div>
        <div class="title">CarScope 🚘</div>
        <div class="subtitle">Booting Pyodide & Streamlit WebAssembly engine...</div>
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.js";

      const files = {"app.py": "\"\"\"\nCarScope \u2014 Vehicle Data Analytics & Comparative Dashboard\nMain Streamlit Application File.\n\"\"\"\n\nimport os\nimport streamlit as st\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# Configure Streamlit page layout and theme title\nst.set_page_config(\n    page_title=\"CarScope \u2014 Vehicle Data Analytics\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\"\n)\n\nfrom src.ui import (\n    apply_custom_css, render_header, render_kpi_card,\n    render_empty_state, render_pandas_snippet,\n    COLOR_PRIMARY, COLOR_SECONDARY, COLOR_POSITIVE, COLOR_WARNING, COLOR_DANGER\n)\nfrom src.data_loader import load_dataset, get_dataset_metadata\nfrom src.column_mapping import render_mapping_sidebar\nfrom src.cleaning import clean_dataset\nfrom src.filters import render_sidebar_filters\nfrom src.analytics import (\n    compute_overview_kpis, compute_top_makes, compute_price_by_make,\n    compute_price_vs_year, compute_correlation_matrix, compute_car_comparison\n)\nfrom src.charts import (\n    plot_top_makes, plot_price_distribution, plot_year_distribution,\n    plot_price_by_make, plot_price_vs_year, plot_price_vs_mileage,\n    plot_price_by_category, plot_car_comparison_normalized,\n    plot_correlation_heatmap, plot_missingness\n)\n\n# Apply minimal light theme CSS\napply_custom_css()\n\n\ndef main():\n    # Sidebar Header & File Upload\n    st.sidebar.markdown(\"# CarScope\")\n    st.sidebar.markdown(\"---\")\n\n    uploaded_file = st.sidebar.file_uploader(\n        \"Upload Car Dataset (CSV)\",\n        type=[\"csv\"],\n        help=\"Upload your own vehicle CSV or use the bundled sample dataset.\"\n    )\n\n    # Determine data source\n    sample_path = \"data/sample_cars.csv\"\n    raw_df = None\n    dataset_name = \"Sample Dataset\"\n\n    if uploaded_file is not None:\n        try:\n            raw_df, dataset_name = load_dataset(uploaded_file)\n            st.sidebar.success(f\"Loaded: {dataset_name}\")\n        except Exception as e:\n            st.sidebar.error(f\"Failed to load uploaded CSV: {e}\")\n            st.stop()\n    elif os.path.exists(sample_path):\n        try:\n            raw_df, dataset_name = load_dataset(sample_path)\n            st.sidebar.info(\"Using bundled sample dataset (`data/sample_cars.csv`)\")\n        except Exception as e:\n            st.sidebar.error(f\"Failed to load sample dataset: {e}\")\n            st.stop()\n    else:\n        st.error(\"No dataset available. Please upload a vehicle CSV file in the sidebar.\")\n        st.stop()\n\n    # Column Mapping UI\n    col_mapping = render_mapping_sidebar(raw_df)\n\n    # Cleaning Options Sidebar\n    st.sidebar.markdown(\"---\")\n    st.sidebar.markdown(\"### Data Cleaning Options\")\n    drop_dup = st.sidebar.checkbox(\"Drop Exact Duplicates\", value=False)\n    exclude_missing_canon = st.sidebar.checkbox(\"Exclude Missing Make/Model\", value=False)\n\n    # Clean Dataset\n    cleaned_df, clean_report = clean_dataset(\n        raw_df,\n        col_mapping,\n        drop_duplicates_flag=drop_dup,\n        exclude_missing_canonical=exclude_missing_canon\n    )\n\n    # Sidebar Interactive Filters\n    filtered_df = render_sidebar_filters(cleaned_df)\n\n    # Minimal Top Header\n    render_header(\n        dataset_name=dataset_name,\n        total_rows=len(filtered_df),\n        status_text=\"Filtered\" if len(filtered_df) != len(cleaned_df) else \"Complete\"\n    )\n\n    # Main Dashboard Page Navigation\n    page = st.sidebar.radio(\n        \"Navigation\",\n        options=[\n            \"Page A \u2014 Overview\",\n            \"Page B \u2014 Explore Data\",\n            \"Page C \u2014 Price Analytics\",\n            \"Page D \u2014 Compare Cars\",\n            \"Page E \u2014 Brand & Segment Insights\",\n            \"Page F \u2014 Correlations\",\n            \"Page G \u2014 Data Quality & Methods\"\n        ],\n        index=0\n    )\n\n    st.sidebar.markdown(\"---\")\n    st.sidebar.caption(\"CarScope v1.0 \u2022 Built with Pandas, Seaborn & Streamlit\")\n\n    # =========================================================================\n    # PAGE A \u2014 OVERVIEW\n    # =========================================================================\n    if page == \"Page A \u2014 Overview\":\n        st.markdown(\"### Dataset Overview & Key Metrics\")\n\n        if filtered_df.empty:\n            render_empty_state()\n            return\n\n        kpis = compute_overview_kpis(filtered_df)\n\n        col1, col2, col3, col4, col5 = st.columns(5)\n        with col1:\n            render_kpi_card(\"Total Vehicles\", f\"{kpis['total_vehicles']:,}\", \"Active filtered count\")\n        with col2:\n            render_kpi_card(\"Unique Makes\", f\"{kpis['unique_makes']}\", \"Distinct brands\")\n        with col3:\n            med_price_str = f\"${kpis['median_price']:,.0f}\" if kpis['median_price'] else \"N/A\"\n            render_kpi_card(\"Median Price\", med_price_str, \"50th percentile price\")\n        with col4:\n            mean_mil_str = f\"{kpis['mean_mileage']:,.0f} mi\" if kpis['mean_mileage'] else \"N/A\"\n            render_kpi_card(\"Avg Mileage\", mean_mil_str, \"Mean odometer reading\")\n        with col5:\n            yr_str = f\"{kpis['year_min']}\u2013{kpis['year_max']}\" if kpis['year_min'] else \"N/A\"\n            render_kpi_card(\"Year Range\", yr_str, \"Production span\")\n\n        # Top Visualizations Row\n        c1, c2 = st.columns(2)\n        with c1:\n            fig_makes = plot_top_makes(filtered_df, top_n=10)\n            if fig_makes:\n                st.pyplot(fig_makes, clear_figure=True)\n                plt.close(fig_makes)\n            else:\n                st.info(\"Make information unavailable for plotting.\")\n\n        with c2:\n            fig_price_dist = plot_price_distribution(filtered_df)\n            if fig_price_dist:\n                st.pyplot(fig_price_dist, clear_figure=True)\n                plt.close(fig_price_dist)\n            else:\n                st.info(\"Price distribution unavailable (missing numeric price column).\")\n\n        c3, c4 = st.columns(2)\n        with c3:\n            fig_yr_dist = plot_year_distribution(filtered_df)\n            if fig_yr_dist:\n                st.pyplot(fig_yr_dist, clear_figure=True)\n                plt.close(fig_yr_dist)\n            else:\n                st.info(\"Year distribution unavailable.\")\n\n        with c4:\n            st.markdown(\"#### Data Health Summary\")\n            meta = get_dataset_metadata(filtered_df)\n            st.write(f\"- **Filtered Records:** `{meta['rows']:,}` rows \u00d7 `{meta['columns']}` columns\")\n            st.write(f\"- **Missing Value Ratio:** `{meta['missing_percentage']}%` missing cells\")\n            st.write(f\"- **Flagged Outliers:** `{clean_report['flagged_outliers']}` suspicious rows\")\n            st.write(f\"- **Usable Complete Rows:** `{len(filtered_df.dropna(subset=['make', 'price'])):,}` rows\")\n\n        render_pandas_snippet(\n            title=\"Overview KPIs and Aggregations\",\n            code_snippet=\"\"\"\n# Compute basic summary metrics using Pandas\ntotal_count = df.shape[0]\nunique_makes = df['make'].nunique()\nmedian_price = df['price'].median()\nmean_mileage = df['mileage'].mean()\n\n# Top 10 makes by listing frequency\ntop_makes = df['make'].value_counts().head(10)\n            \"\"\",\n            explanation=\"Overview statistics use `.shape[0]`, `.nunique()`, `.median()`, `.mean()`, and `.value_counts()`.\"\n        )\n\n    # =========================================================================\n    # PAGE B \u2014 EXPLORE DATA\n    # =========================================================================\n    elif page == \"Page B \u2014 Explore Data\":\n        st.markdown(\"### Searchable & Sortable Data Table\")\n\n        if filtered_df.empty:\n            render_empty_state()\n            return\n\n        c_search, c_sort, c_order = st.columns([2, 1, 1])\n        with c_search:\n            search_query = st.text_input(\"Search by Make or Model\", value=\"\", placeholder=\"e.g. Toyota or Civic\")\n        with c_sort:\n            sort_col = st.selectbox(\"Sort By Column\", options=[c for c in filtered_df.columns if c != \"car_id\"], index=0)\n        with c_order:\n            sort_order = st.radio(\"Order\", options=[\"Ascending\", \"Descending\"], horizontal=True)\n\n        display_df = filtered_df.copy()\n        if search_query:\n            query = search_query.lower()\n            mask = display_df[\"make\"].astype(str).str.lower().str.contains(query) | display_df[\"model\"].astype(str).str.lower().str.contains(query)\n            display_df = display_df[mask]\n\n        display_df = display_df.sort_values(by=sort_col, ascending=(sort_order == \"Ascending\"))\n\n        st.caption(f\"Displaying **{len(display_df):,}** of **{len(cleaned_df):,}** cleaned vehicle records.\")\n        st.dataframe(display_df.drop(columns=[\"is_outlier\"], errors=\"ignore\"), use_container_width=True, height=400)\n\n        # Download Filtered Data Button\n        csv_data = display_df.to_csv(index=False).encode(\"utf-8\")\n        st.download_button(\n            label=\"Download Filtered Dataset (CSV)\",\n            data=csv_data,\n            file_name=\"carscope_filtered_data.csv\",\n            mime=\"text/csv\",\n            type=\"primary\"\n        )\n\n        st.markdown(\"#### Summary of Categorical & Numeric Attributes\")\n        tab_num, tab_cat = st.tabs([\"Numeric Summary\", \"Categorical Summary\"])\n\n        with tab_num:\n            num_cols = display_df.select_dtypes(include=[np.number]).columns.tolist()\n            if num_cols:\n                st.dataframe(display_df[num_cols].describe().T, use_container_width=True)\n            else:\n                st.info(\"No numeric columns available.\")\n\n        with tab_cat:\n            cat_cols = display_df.select_dtypes(include=[\"object\", \"category\"]).columns.tolist()\n            if cat_cols:\n                cat_summary = []\n                for c in cat_cols:\n                    if c != \"car_id\":\n                        cat_summary.append({\n                            \"column\": c,\n                            \"unique_values\": display_df[c].nunique(),\n                            \"top_category\": display_df[c].mode()[0] if not display_df[c].dropna().empty else \"N/A\",\n                            \"top_frequency\": display_df[c].value_counts().iloc[0] if not display_df[c].dropna().empty else 0\n                        })\n                st.dataframe(pd.DataFrame(cat_summary), use_container_width=True)\n\n        render_pandas_snippet(\n            title=\"Filtering, Sorting & Text Search\",\n            code_snippet=\"\"\"\n# Case-insensitive text search on Make/Model\nquery = \"toyota\"\nmask = df['make'].str.lower().str.contains(query) | df['model'].str.lower().str.contains(query)\nfiltered_df = df[mask]\n\n# Sort values by specified column\nsorted_df = filtered_df.sort_values(by='price', ascending=False)\n            \"\"\",\n            explanation=\"Defensive filtering uses boolean masks (`.str.contains`) and sorting (`.sort_values`).\"\n        )\n\n    # =========================================================================\n    # PAGE C \u2014 PRICE ANALYTICS\n    # =========================================================================\n    elif page == \"Page C \u2014 Price Analytics\":\n        st.markdown(\"### Price Analytics & Valuation Trends\")\n\n        if filtered_df.empty:\n            render_empty_state()\n            return\n\n        # 1. Price by Make\n        st.markdown(\"#### Price Comparison by Brand\")\n        min_samples = st.slider(\"Minimum listings per make to display\", min_value=1, max_value=10, value=2)\n        df_price_make = compute_price_by_make(filtered_df, min_group_size=min_samples)\n\n        if not df_price_make.empty:\n            fig_pm = plot_price_by_make(df_price_make)\n            if fig_pm:\n                st.pyplot(fig_pm, clear_figure=True)\n                plt.close(fig_pm)\n        else:\n            st.info(f\"No make has at least {min_samples} valid listings.\")\n\n        # 2. Price by Production Year & Price vs Mileage\n        col_left, col_right = st.columns(2)\n        with col_left:\n            st.markdown(\"#### Price by Production Year\")\n            df_price_yr = compute_price_vs_year(filtered_df)\n            if not df_price_yr.empty:\n                fig_py = plot_price_vs_year(df_price_yr)\n                if fig_py:\n                    st.pyplot(fig_py, clear_figure=True)\n                    plt.close(fig_py)\n            else:\n                st.info(\"Year & Price data unavailable.\")\n\n        with col_right:\n            st.markdown(\"#### Price vs. Mileage\")\n            show_reg = st.toggle(\"Show Linear Regression Line\", value=True)\n            fig_pmil = plot_price_vs_mileage(filtered_df, show_regression=show_reg)\n            if fig_pmil:\n                st.pyplot(fig_pmil, clear_figure=True)\n                plt.close(fig_pmil)\n            else:\n                st.info(\"Mileage & Price data unavailable.\")\n\n        # 3. Price Distribution across Segments\n        st.markdown(\"#### Price Distribution by Transmission / Fuel Type\")\n        segment_col = st.radio(\"Segment Column\", options=[\"transmission\", \"fuel_type\", \"body_type\"], horizontal=True)\n        fig_seg = plot_price_by_category(filtered_df, segment_col)\n        if fig_seg:\n            st.pyplot(fig_seg, clear_figure=True)\n            plt.close(fig_seg)\n        else:\n            st.info(f\"Column '{segment_col}' is unavailable or has missing values.\")\n\n        st.warning(\"Observational Disclaimer: Relationships in observational data (e.g. price vs. mileage) describe sample trends and do not prove direct causal effects or guarantee future market value.\")\n\n        render_pandas_snippet(\n            title=\"Groupby Aggregation & Pearson Correlation\",\n            code_snippet=\"\"\"\n# Calculate Mean and Median price grouped by Make\nprice_stats = df.groupby('make')['price'].agg(['mean', 'median', 'count'])\n\n# Filter by minimum sample size\nprice_stats_filtered = price_stats[price_stats['count'] >= 2]\n\n# Compute Pearson correlation coefficient between price and mileage\ncorr = df['price'].corr(df['mileage'], method='pearson')\n            \"\"\",\n            explanation=\"Pandas `.groupby()`, `.agg()`, and `.corr()` enable statistical aggregations.\"\n        )\n\n    # =========================================================================\n    # PAGE D \u2014 COMPARE CARS\n    # =========================================================================\n    elif page == \"Page D \u2014 Compare Cars\":\n        st.markdown(\"### Side-by-Side Vehicle Comparison\")\n        st.caption(\"Select 2 to 4 vehicles from the current dataset to evaluate specifications and normalized performance metrics.\")\n\n        if filtered_df.empty or \"car_id\" not in filtered_df.columns:\n            render_empty_state()\n            return\n\n        available_cars = filtered_df[\"car_id\"].unique().tolist()\n        default_selection = available_cars[:2] if len(available_cars) >= 2 else available_cars\n\n        selected_car_ids = st.multiselect(\n            \"Select Vehicles to Compare (2 to 4 cars)\",\n            options=available_cars,\n            default=default_selection,\n            max_selections=4\n        )\n\n        if len(selected_car_ids) < 2:\n            st.info(\"Please select at least 2 vehicles to generate comparison tables and charts.\")\n            return\n\n        raw_specs, normalized_df = compute_car_comparison(filtered_df, selected_car_ids)\n\n        st.markdown(\"#### Attribute Specification Matrix\")\n        st.dataframe(raw_specs, use_container_width=True)\n\n        st.markdown(\"#### Normalized Metric Scores (Min-Max Scaled 0.0 to 1.0)\")\n        fig_comp = plot_car_comparison_normalized(normalized_df)\n        if fig_comp:\n            st.pyplot(fig_comp, clear_figure=True)\n            plt.close(fig_comp)\n\n        st.info(\"Normalization Note: Min-Max scaling normalizes metrics within the selected group (0.0 = minimum among selection, 1.0 = maximum). This enables comparison across distinct units (e.g. Price vs. Horsepower).\")\n\n        render_pandas_snippet(\n            title=\"Vehicle Comparison & Min-Max Scaling\",\n            code_snippet=\"\"\"\n# Min-Max normalization score formula for attribute x:\n# score = (x - min(x)) / (max(x) - min(x))\n\nselected_df = df[df['car_id'].isin(selected_ids)]\nmin_val = selected_df['price'].min()\nmax_val = selected_df['price'].max()\nnorm_price = (selected_df['price'] - min_val) / (max_val - min_val)\n            \"\"\",\n            explanation=\"Normalization rescales numeric columns to a 0.0 to 1.0 range for cross-metric comparison.\"\n        )\n\n    # =========================================================================\n    # PAGE E \u2014 BRAND & SEGMENT INSIGHTS\n    # =========================================================================\n    elif page == \"Page E \u2014 Brand & Segment Insights\":\n        st.markdown(\"### Brand & Market Segment Analysis\")\n\n        if filtered_df.empty:\n            render_empty_state()\n            return\n\n        c_b1, c_b2 = st.columns(2)\n        with c_b1:\n            st.markdown(\"#### Brand Market Share (Listing Frequency)\")\n            makes_df = compute_top_makes(filtered_df, top_n=15)\n            st.dataframe(makes_df, use_container_width=True)\n\n        with c_b2:\n            st.markdown(\"#### Median Price by Brand\")\n            price_make_df = compute_price_by_make(filtered_df, min_group_size=1)\n            st.dataframe(price_make_df, use_container_width=True)\n\n        st.markdown(\"#### Brand Head-to-Head Comparison\")\n        all_makes = sorted(filtered_df[\"make\"].dropna().unique().tolist()) if \"make\" in filtered_df.columns else []\n\n        if len(all_makes) >= 2:\n            bm1, bm2 = st.columns(2)\n            with bm1:\n                brand1 = st.selectbox(\"Select Brand 1\", options=all_makes, index=0)\n            with bm2:\n                brand2 = st.selectbox(\"Select Brand 2\", options=all_makes, index=1 if len(all_makes) > 1 else 0)\n\n            df_b1 = filtered_df[filtered_df[\"make\"] == brand1]\n            df_b2 = filtered_df[filtered_df[\"make\"] == brand2]\n\n            kpi1 = compute_overview_kpis(df_b1)\n            kpi2 = compute_overview_kpis(df_b2)\n\n            comp_records = [\n                {\"Metric\": \"Total Listings\", brand1: kpi1[\"total_vehicles\"], brand2: kpi2[\"total_vehicles\"]},\n                {\"Metric\": \"Median Price\", brand1: f\"${kpi1['median_price']:,.0f}\" if kpi1['median_price'] else \"N/A\", brand2: f\"${kpi2['median_price']:,.0f}\" if kpi2['median_price'] else \"N/A\"},\n                {\"Metric\": \"Mean Price\", brand1: f\"${kpi1['mean_price']:,.0f}\" if kpi1['mean_price'] else \"N/A\", brand2: f\"${kpi2['mean_price']:,.0f}\" if kpi2['mean_price'] else \"N/A\"},\n                {\"Metric\": \"Avg Mileage\", brand1: f\"{kpi1['mean_mileage']:,.0f} mi\" if kpi1['mean_mileage'] else \"N/A\", brand2: f\"{kpi2['mean_mileage']:,.0f} mi\" if kpi2['mean_mileage'] else \"N/A\"},\n                {\"Metric\": \"Year Span\", brand1: f\"{kpi1['year_min']}\u2013{kpi1['year_max']}\" if kpi1['year_min'] else \"N/A\", brand2: f\"{kpi2['year_min']}\u2013{kpi2['year_max']}\" if kpi2['year_min'] else \"N/A\"},\n            ]\n            st.dataframe(pd.DataFrame(comp_records), use_container_width=True)\n\n        render_pandas_snippet(\n            title=\"Subsetting Data for Brand Comparison\",\n            code_snippet=\"\"\"\n# Filter DataFrame for specific brands\nbrand1_df = df[df['make'] == 'Toyota']\nbrand2_df = df[df['make'] == 'Honda']\n\n# Compare median prices\nmed1 = brand1_df['price'].median()\nmed2 = brand2_df['price'].median()\n            \"\"\",\n            explanation=\"Pandas comparison uses boolean filtering to separate subset DataFrames.\"\n        )\n\n    # =========================================================================\n    # PAGE F \u2014 CORRELATIONS\n    # =========================================================================\n    elif page == \"Page F \u2014 Correlations\":\n        st.markdown(\"### Numeric Correlations\")\n\n        if filtered_df.empty:\n            render_empty_state()\n            return\n\n        numeric_cols = filtered_df.select_dtypes(include=[np.number]).columns.tolist()\n        numeric_cols = [c for c in numeric_cols if c != \"is_outlier\"]\n\n        if len(numeric_cols) < 2:\n            st.warning(\"Insufficient numeric variables available for correlation matrix.\")\n            return\n\n        c_corr1, c_corr2 = st.columns([3, 1])\n        with c_corr1:\n            selected_num = st.multiselect(\"Select Numeric Columns for Correlation\", options=numeric_cols, default=numeric_cols)\n        with c_corr2:\n            corr_method = st.radio(\"Correlation Method\", options=[\"pearson\", \"spearman\"])\n\n        if len(selected_num) >= 2:\n            corr_df, valid_cols = compute_correlation_matrix(filtered_df, selected_num, method=corr_method)\n            if not corr_df.empty:\n                fig_corr = plot_correlation_heatmap(corr_df)\n                if fig_corr:\n                    st.pyplot(fig_corr, clear_figure=True)\n                    plt.close(fig_corr)\n            else:\n                st.warning(\"Selected numeric variables contain constant values or zero variance.\")\n        else:\n            st.info(\"Select at least 2 numeric variables.\")\n\n        st.warning(\"Statistical Reminder: A high correlation coefficient (r) measures linear association, but does not prove causation.\")\n\n        render_pandas_snippet(\n            title=\"Correlation Matrix Computation\",\n            code_snippet=\"\"\"\n# Compute Pearson or Spearman correlation matrix on numeric columns\nnumeric_df = df[['price', 'mileage', 'horsepower', 'year']]\ncorr_matrix = numeric_df.corr(method='pearson')\n            \"\"\",\n            explanation=\"`.corr()` ignores NaN cells automatically when calculating pairwise correlation.\"\n        )\n\n    # =========================================================================\n    # PAGE G \u2014 DATA QUALITY & METHODS\n    # =========================================================================\n    elif page == \"Page G \u2014 Data Quality & Methods\":\n        st.markdown(\"### Data Quality Audit & Methods\")\n\n        st.markdown(\"#### Record Count Pipeline Summary\")\n        q1, q2, q3, q4 = st.columns(4)\n        with q1:\n            render_kpi_card(\"Raw CSV Rows\", f\"{clean_report['raw_rows']:,}\")\n        with q2:\n            render_kpi_card(\"Duplicates Found\", f\"{clean_report['exact_duplicates']:,}\")\n        with q3:\n            render_kpi_card(\"Outliers Flagged\", f\"{clean_report['flagged_outliers']:,}\")\n        with q4:\n            render_kpi_card(\"Cleaned Rows\", f\"{clean_report['cleaned_rows']:,}\")\n\n        c_qleft, c_qright = st.columns(2)\n        with c_qleft:\n            st.markdown(\"#### Missing Data Percentage by Column\")\n            fig_miss = plot_missingness(cleaned_df)\n            if fig_miss:\n                st.pyplot(fig_miss, clear_figure=True)\n                plt.close(fig_miss)\n\n        with c_qright:\n            st.markdown(\"#### Data Cleaning Decision Log\")\n            st.write(f\"- **Raw File Records:** `{clean_report['raw_rows']:,}` rows\")\n            st.write(f\"- **Exact Duplicates:** `{clean_report['exact_duplicates']}` rows identified\")\n            st.write(f\"- **Removed Duplicates:** `{clean_report['removed_duplicates']}` rows dropped\")\n            st.write(f\"- **Flagged Outliers:** `{clean_report['flagged_outliers']}` rows flagged with `is_outlier=True`\")\n\n            if clean_report[\"outlier_details\"]:\n                st.write(\"**Outlier Flags:**\")\n                for d in clean_report[\"outlier_details\"]:\n                    st.write(f\"  \u2022 {d}\")\n\n        # Cleaned CSV Export\n        csv_cleaned = cleaned_df.to_csv(index=False).encode(\"utf-8\")\n        st.download_button(\n            label=\"Export Full Cleaned Dataset (CSV)\",\n            data=csv_cleaned,\n            file_name=\"carscope_cleaned_data.csv\",\n            mime=\"text/csv\",\n            type=\"primary\"\n        )\n\n        st.markdown(\"#### Summary Statistics via DataFrame.describe()\")\n        st.dataframe(cleaned_df.describe().T, use_container_width=True)\n\n        render_pandas_snippet(\n            title=\"Data Quality & Missingness Auditing\",\n            code_snippet=\"\"\"\n# Calculate null counts per column\nmissing_counts = df.isna().sum()\n\n# Calculate missing percentage per column\nmissing_pct = (df.isna().sum() / len(df)) * 100\n\n# Summary descriptive statistics for numeric columns\nsummary_stats = df.describe()\n            \"\"\",\n            explanation=\"Data quality checks use `.isna().sum()` and `.describe()` to inspect completeness and distributions.\"\n        )\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/__init__.py": "# CarScope source package\n", "src/ui.py": "\"\"\"\nUI helper module for CarScope.\nApplies clean, minimal light-mode CSS with soft elevation shadows,\nno heavy outline borders, a minimal header, and guarantees sidebar navigation buttons stay visible.\n\"\"\"\n\nimport streamlit as st\n\n# Color Palette Constants (Clean Minimal Light Mode)\nCOLOR_BACKGROUND = \"#F8FAFC\"\nCOLOR_SIDEBAR = \"#F1F5F9\"\nCOLOR_SURFACE = \"#FFFFFF\"\nCOLOR_BORDER = \"#E2E8F0\"\nCOLOR_TEXT_PRIMARY = \"#0F172A\"\nCOLOR_TEXT_SECONDARY = \"#475569\"\nCOLOR_PRIMARY = \"#0284C7\"\nCOLOR_SECONDARY = \"#6366F1\"\nCOLOR_POSITIVE = \"#10B981\"\nCOLOR_WARNING = \"#F59E0B\"\nCOLOR_DANGER = \"#EF4444\"\n\n# Seaborn / Matplotlib palette sequence\nCHART_PALETTE = [\n    \"#0284C7\", \"#6366F1\", \"#10B981\", \"#F59E0B\",\n    \"#EF4444\", \"#8B5CF6\", \"#06B6D4\", \"#84CC16\"\n]\n\n\ndef apply_custom_css():\n    \"\"\"Inject minimal light-mode CSS with soft card shadows, clean typography, visible sidebar toggle, and no line clutter.\"\"\"\n    css = f\"\"\"\n    <style>\n        /* Force Root & Main Canvas Background */\n        html, body, .stApp, [data-testid=\"stAppViewContainer\"], .stMain {{\n            background-color: {COLOR_BACKGROUND} !important;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;\n        }}\n\n        /* Header Bar Background */\n        [data-testid=\"stHeader\"] {{\n            background-color: {COLOR_BACKGROUND} !important;\n        }}\n\n        /* Hide ONLY Streamlit Deploy Button */\n        [data-testid=\"stDeployButton\"],\n        [data-testid=\"stAppDeployButton\"],\n        .stDeployButton,\n        .stAppDeployButton,\n        button[title*=\"Deploy\"] {{\n            display: none !important;\n            visibility: hidden !important;\n            opacity: 0 !important;\n            width: 0 !important;\n            height: 0 !important;\n            margin: 0 !important;\n            padding: 0 !important;\n            pointer-events: none !important;\n        }}\n\n        /* Explicitly keep Sidebar Expand / Collapse Toggle Button visible & styled at all times */\n        [data-testid=\"stCollapsedControl\"],\n        [data-testid=\"stSidebarCollapseButton\"],\n        [data-testid=\"stSidebarExpandButton\"],\n        [data-testid=\"stHeaderSidebarToggle\"],\n        button[data-testid=\"stSidebarCollapseButton\"],\n        button[data-testid=\"stSidebarExpandButton\"],\n        button[data-testid=\"stHeaderSidebarToggle\"],\n        button[aria-label*=\"sidebar\" i],\n        button[title*=\"sidebar\" i],\n        button[aria-label*=\"Sidebar\" i],\n        button[title*=\"Sidebar\" i] {{\n            display: flex !important;\n            visibility: visible !important;\n            opacity: 1 !important;\n            pointer-events: auto !important;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            background-color: {COLOR_SURFACE} !important;\n            border: 1px solid {COLOR_BORDER} !important;\n            border-radius: 8px !important;\n            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08) !important;\n            z-index: 999999 !important;\n            transition: background-color 0.15s ease, border-color 0.15s ease !important;\n        }}\n\n        [data-testid=\"stCollapsedControl\"]:hover,\n        [data-testid=\"stSidebarCollapseButton\"]:hover,\n        [data-testid=\"stSidebarExpandButton\"]:hover,\n        [data-testid=\"stHeaderSidebarToggle\"]:hover,\n        button[aria-label*=\"sidebar\" i]:hover {{\n            background-color: #F1F5F9 !important;\n            border-color: {COLOR_PRIMARY} !important;\n        }}\n\n        /* SVG icons inside sidebar toggle buttons */\n        [data-testid=\"stCollapsedControl\"] svg,\n        [data-testid=\"stSidebarCollapseButton\"] svg,\n        [data-testid=\"stSidebarExpandButton\"] svg,\n        [data-testid=\"stHeaderSidebarToggle\"] svg,\n        button[data-testid=\"stHeaderSidebarToggle\"] svg,\n        button[aria-label*=\"sidebar\" i] svg,\n        button[title*=\"sidebar\" i] svg {{\n            color: {COLOR_TEXT_PRIMARY} !important;\n            fill: {COLOR_TEXT_PRIMARY} !important;\n            stroke: {COLOR_TEXT_PRIMARY} !important;\n            width: 1.25rem !important;\n            height: 1.25rem !important;\n            display: block !important;\n            visibility: visible !important;\n            opacity: 1 !important;\n        }}\n\n        [data-testid=\"stCollapsedControl\"] svg path,\n        [data-testid=\"stSidebarCollapseButton\"] svg path,\n        [data-testid=\"stSidebarExpandButton\"] svg path,\n        [data-testid=\"stHeaderSidebarToggle\"] svg path,\n        button[aria-label*=\"sidebar\" i] svg path {{\n            fill: {COLOR_TEXT_PRIMARY} !important;\n            stroke: {COLOR_TEXT_PRIMARY} !important;\n        }}\n\n        /* Keep Three-Dots menu visible */\n        [data-testid=\"stMainMenu\"],\n        [data-testid=\"stMainMenu\"] button,\n        header button[aria-label=\"Main menu\"] {{\n            display: flex !important;\n            visibility: visible !important;\n            opacity: 1 !important;\n            pointer-events: auto !important;\n        }}\n\n        /* Sidebar Styling */\n        section[data-testid=\"stSidebar\"], [data-testid=\"stSidebarNav\"] {{\n            background-color: {COLOR_SIDEBAR} !important;\n            border-right: 1px solid {COLOR_BORDER} !important;\n        }}\n\n        /* Sidebar Navigation Radio Options Styling */\n        div[data-testid=\"stRadio\"] label {{\n            font-weight: 500 !important;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            padding: 0.35rem 0.6rem !important;\n            border-radius: 6px !important;\n            transition: background-color 0.15s ease !important;\n        }}\n        div[data-testid=\"stRadio\"] label:hover {{\n            background-color: rgba(2, 132, 199, 0.08) !important;\n            color: {COLOR_PRIMARY} !important;\n        }}\n\n        /* Typography Color Overrides */\n        h1, h2, h3, h4, h5, h6, p, span, label, div, li, small {{\n            color: {COLOR_TEXT_PRIMARY} !important;\n        }}\n        .stCaption, [data-testid=\"stCaptionContainer\"] p {{\n            color: {COLOR_TEXT_SECONDARY} !important;\n        }}\n\n        /* Minimal Header Container */\n        .carscope-header {{\n            margin-bottom: 1.25rem;\n            padding-bottom: 0.75rem;\n        }}\n        .carscope-title {{\n            font-size: 2.2rem;\n            font-weight: 800;\n            letter-spacing: -0.02em;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            margin: 0;\n        }}\n        .carscope-title span {{\n            color: {COLOR_PRIMARY} !important;\n        }}\n\n        /* Soft Highlight KPI Cards */\n        .kpi-card {{\n            background-color: {COLOR_SURFACE} !important;\n            border: none !important;\n            border-radius: 12px;\n            padding: 1.25rem 1.4rem;\n            margin-bottom: 1rem;\n            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05) !important;\n            transition: transform 0.15s ease, box-shadow 0.15s ease;\n        }}\n        .kpi-card:hover {{\n            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.1) !important;\n        }}\n        .kpi-label {{\n            font-size: 0.8rem;\n            font-weight: 600;\n            text-transform: uppercase;\n            letter-spacing: 0.05em;\n            color: {COLOR_TEXT_SECONDARY} !important;\n            margin-bottom: 0.4rem;\n        }}\n        .kpi-value {{\n            font-size: 1.85rem;\n            font-weight: 700;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            font-feature-settings: \"tnum\";\n            font-variant-numeric: tabular-nums;\n            line-height: 1.1;\n        }}\n        .kpi-subtext {{\n            font-size: 0.78rem;\n            color: {COLOR_TEXT_SECONDARY} !important;\n            margin-top: 0.35rem;\n        }}\n\n        /* Soft Highlighted Cards for Containers & Plot Cards */\n        [data-testid=\"stVerticalBlockBorderWrapper\"] {{\n            background-color: {COLOR_SURFACE} !important;\n            border: none !important;\n            border-radius: 12px !important;\n            padding: 1.25rem !important;\n            margin-bottom: 1.25rem !important;\n            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05) !important;\n        }}\n\n        [data-testid=\"stImage\"] {{\n            background-color: {COLOR_SURFACE} !important;\n            border: none !important;\n            border-radius: 10px !important;\n            padding: 0.4rem !important;\n        }}\n\n        /* Status Badge */\n        .status-badge {{\n            display: inline-flex;\n            align-items: center;\n            padding: 0.35rem 0.85rem;\n            border-radius: 20px;\n            font-size: 0.8rem;\n            font-weight: 600;\n            background-color: rgba(2, 132, 199, 0.08) !important;\n            color: {COLOR_PRIMARY} !important;\n            border: 1px solid rgba(2, 132, 199, 0.2) !important;\n        }}\n\n        /* Expander & Code Box */\n        [data-testid=\"stExpander\"] {{\n            background-color: {COLOR_SURFACE} !important;\n            border: none !important;\n            border-radius: 10px !important;\n            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04) !important;\n        }}\n\n        /* Buttons Styling */\n        .stButton button, .stDownloadButton button {{\n            background-color: {COLOR_PRIMARY} !important;\n            color: #FFFFFF !important;\n            border-radius: 8px !important;\n            font-weight: 600 !important;\n            border: none !important;\n            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2) !important;\n        }}\n        .stButton button:hover, .stDownloadButton button:hover {{\n            background-color: #0369A1 !important;\n        }}\n\n        /* Form Controls & Dropdowns */\n        div[data-baseweb=\"select\"] > div {{\n            background-color: {COLOR_SURFACE} !important;\n            border-color: {COLOR_BORDER} !important;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            border-radius: 8px !important;\n        }}\n        input[type=\"text\"] {{\n            background-color: {COLOR_SURFACE} !important;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            border-color: {COLOR_BORDER} !important;\n            border-radius: 8px !important;\n        }}\n\n        /* Dataframe & Table Card Container */\n        [data-testid=\"stDataFrame\"], div[data-testid=\"stTable\"] {{\n            background-color: {COLOR_SURFACE} !important;\n            border: none !important;\n            border-radius: 10px !important;\n            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04) !important;\n        }}\n\n        /* Empty state notification box */\n        .empty-state-box {{\n            background-color: {COLOR_SURFACE} !important;\n            border: 1px dashed {COLOR_BORDER} !important;\n            border-radius: 10px;\n            padding: 2rem;\n            text-align: center;\n            color: {COLOR_TEXT_SECONDARY} !important;\n            margin: 1.5rem 0;\n            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);\n        }}\n        .empty-state-title {{\n            font-size: 1.1rem;\n            font-weight: 600;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            margin-bottom: 0.5rem;\n        }}\n\n        /* Section headers */\n        .section-header {{\n            font-size: 1.3rem;\n            font-weight: 700;\n            color: {COLOR_TEXT_PRIMARY} !important;\n            margin-top: 1.5rem;\n            margin-bottom: 0.8rem;\n        }}\n\n        /* Clean Streamlit tab styling override */\n        button[data-baseweb=\"tab\"] {{\n            font-weight: 600 !important;\n            font-size: 0.95rem !important;\n        }}\n    </style>\n    \"\"\"\n    st.markdown(css, unsafe_allow_html=True)\n\n\ndef render_header(dataset_name: str, total_rows: int, status_text: str = \"Active\"):\n    \"\"\"Render minimal CarScope title header without tagline or subtitle.\"\"\"\n    st.markdown(\n        f\"\"\"\n        <div class=\"carscope-header\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;\">\n                <div>\n                    <h1 class=\"carscope-title\">Car<span>Scope</span></h1>\n                </div>\n                <div>\n                    <div class=\"status-badge\">\n                        {dataset_name} ({total_rows:,} rows)\n                    </div>\n                </div>\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef render_kpi_card(label: str, value: str, subtext: str = \"\"):\n    \"\"\"Render a clean light-mode KPI card with soft shadow highlight.\"\"\"\n    st.markdown(\n        f\"\"\"\n        <div class=\"kpi-card\">\n            <div class=\"kpi-label\">{label}</div>\n            <div class=\"kpi-value\">{value}</div>\n            {f'<div class=\"kpi-subtext\">{subtext}</div>' if subtext else ''}\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef render_empty_state(title: str = \"No vehicles match the selected filters\", message: str = \"Try adjusting your sidebar filter choices or resetting all filters.\"):\n    \"\"\"Render minimal empty state feedback box.\"\"\"\n    st.markdown(\n        f\"\"\"\n        <div class=\"empty-state-box\">\n            <div class=\"empty-state-title\">{title}</div>\n            <div>{message}</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef render_pandas_snippet(title: str, code_snippet: str, explanation: str = \"\"):\n    \"\"\"Render a clean learning expander with Pandas code snippet.\"\"\"\n    with st.expander(f\"Pandas Behind the Chart \u2014 {title}\"):\n        if explanation:\n            st.markdown(f\"*{explanation}*\")\n        st.code(code_snippet.strip(), language=\"python\")\n", "src/data_loader.py": "\"\"\"\nData loader module for CarScope.\nHandles defensive reading of CSV data from file upload or local disk paths,\nreturning raw DataFrames and dataset metadata.\n\"\"\"\n\nfrom typing import Tuple, Dict, Any, Union\nimport pandas as pd\nimport io\n\n\ndef load_dataset(file_source: Union[str, io.BytesIO, Any]) -> Tuple[pd.DataFrame, str]:\n    \"\"\"\n    Safely load CSV data from a file path or Streamlit UploadedFile object.\n    Supports encoding fallbacks (utf-8, latin1, cp1252) and delimiter detection.\n\n    Returns:\n        Tuple of (df: pd.DataFrame, dataset_name: str)\n    \"\"\"\n    dataset_name = \"Uploaded Dataset\"\n    if isinstance(file_source, str):\n        dataset_name = file_source.split(\"/\")[-1]\n\n    encodings = [\"utf-8\", \"latin1\", \"cp1252\"]\n\n    for encoding in encodings:\n        try:\n            if hasattr(file_source, \"seek\"):\n                file_source.seek(0)\n                if hasattr(file_source, \"name\"):\n                    dataset_name = file_source.name\n\n            df = pd.read_csv(file_source, encoding=encoding)\n            \n            # Trim whitespace from raw column names\n            df.columns = [str(col).strip() for col in df.columns]\n\n            if df.empty:\n                raise ValueError(\"The uploaded CSV file is empty.\")\n\n            return df, dataset_name\n        except (UnicodeDecodeError, pd.errors.ParserError):\n            continue\n        except Exception as e:\n            raise ValueError(f\"Error reading CSV file: {str(e)}\")\n\n    raise ValueError(\"Failed to parse CSV file with supported encodings (UTF-8, Latin1, CP1252).\")\n\n\ndef get_dataset_metadata(df: pd.DataFrame) -> Dict[str, Any]:\n    \"\"\"\n    Calculate summary metadata for a loaded DataFrame.\n    \"\"\"\n    total_rows, total_cols = df.shape\n    total_cells = total_rows * total_cols\n    missing_cells = df.isna().sum().sum()\n    missing_pct = (missing_cells / total_cells * 100) if total_cells > 0 else 0.0\n    memory_usage_mb = df.memory_usage(deep=True).sum() / (1024 * 1024)\n\n    return {\n        \"rows\": total_rows,\n        \"columns\": total_cols,\n        \"total_cells\": total_cells,\n        \"missing_cells\": missing_cells,\n        \"missing_percentage\": round(missing_pct, 1),\n        \"memory_mb\": round(memory_usage_mb, 2),\n        \"dtypes\": df.dtypes.to_dict(),\n        \"null_counts\": df.isna().sum().to_dict(),\n    }\n", "src/column_mapping.py": "\"\"\"\nColumn mapping module for CarScope.\nProvides canonical schema definitions, alias matching heuristics,\nunit tagging, and interactive mapping state controls.\n\"\"\"\n\nfrom typing import Dict, List, Optional\nimport streamlit as st\nimport pandas as pd\n\n# Canonical field definitions with labels, descriptions, and alias heuristics\nCANONICAL_FIELDS = {\n    \"make\": {\n        \"label\": \"Make / Brand\",\n        \"required\": True,\n        \"aliases\": [\"make\", \"manufacturer\", \"brand\", \"company\", \"car_make\"],\n        \"unit\": None\n    },\n    \"model\": {\n        \"label\": \"Model\",\n        \"required\": True,\n        \"aliases\": [\"model\", \"car_model\", \"model_name\", \"vehicle_model\", \"trim\"],\n        \"unit\": None\n    },\n    \"year\": {\n        \"label\": \"Year\",\n        \"required\": False,\n        \"aliases\": [\"year\", \"model_year\", \"prod_year\", \"reg_year\", \"registration_year\"],\n        \"unit\": \"Year\"\n    },\n    \"price\": {\n        \"label\": \"Price\",\n        \"required\": False,\n        \"aliases\": [\"price\", \"selling_price\", \"cost\", \"msrp\", \"value\", \"price_usd\", \"amount\"],\n        \"unit\": \"$\"\n    },\n    \"mileage\": {\n        \"label\": \"Mileage\",\n        \"required\": False,\n        \"aliases\": [\"mileage\", \"odometer\", \"km_driven\", \"distance\", \"miles\", \"kms_driven\"],\n        \"unit\": \"mi\"\n    },\n    \"fuel_type\": {\n        \"label\": \"Fuel Type\",\n        \"required\": False,\n        \"aliases\": [\"fuel_type\", \"fuel\", \"fueltype\", \"engine_fuel\", \"fuel_category\"],\n        \"unit\": None\n    },\n    \"transmission\": {\n        \"label\": \"Transmission\",\n        \"required\": False,\n        \"aliases\": [\"transmission\", \"gearbox\", \"gear_type\", \"trans\", \"transmission_type\"],\n        \"unit\": None\n    },\n    \"engine_size\": {\n        \"label\": \"Engine Size\",\n        \"required\": False,\n        \"aliases\": [\"engine_size\", \"engine\", \"displacement\", \"vol_cc\", \"engine_capacity\", \"engine_l\"],\n        \"unit\": \"L\"\n    },\n    \"horsepower\": {\n        \"label\": \"Horsepower\",\n        \"required\": False,\n        \"aliases\": [\"horsepower\", \"power\", \"hp\", \"max_power\", \"engine_hp\", \"bhp\"],\n        \"unit\": \"hp\"\n    },\n    \"mpg\": {\n        \"label\": \"Fuel Economy (MPG)\",\n        \"required\": False,\n        \"aliases\": [\"mpg\", \"fuel_economy\", \"consumption\", \"kml\", \"l_per_100km\"],\n        \"unit\": \"mpg\"\n    },\n    \"body_type\": {\n        \"label\": \"Body Type\",\n        \"required\": False,\n        \"aliases\": [\"body_type\", \"body\", \"vehicle_type\", \"car_type\", \"style\", \"category\"],\n        \"unit\": None\n    },\n    \"condition\": {\n        \"label\": \"Condition\",\n        \"required\": False,\n        \"aliases\": [\"condition\", \"status\", \"usage\", \"state_desc\"],\n        \"unit\": None\n    },\n    \"location\": {\n        \"label\": \"Location\",\n        \"required\": False,\n        \"aliases\": [\"location\", \"city\", \"state\", \"region\", \"zip_code\"],\n        \"unit\": None\n    },\n}\n\n\ndef auto_suggest_mappings(raw_columns: List[str]) -> Dict[str, Optional[str]]:\n    \"\"\"\n    Suggest canonical mapping from raw dataset columns based on case-insensitive alias matching.\n    \"\"\"\n    mapped = {field: None for field in CANONICAL_FIELDS}\n    normalized_raw = {col.lower().strip().replace(\" \", \"_\"): col for col in raw_columns}\n\n    for field, info in CANONICAL_FIELDS.items():\n        for alias in info[\"aliases\"]:\n            if alias in normalized_raw:\n                mapped[field] = normalized_raw[alias]\n                break\n\n    return mapped\n\n\ndef render_mapping_sidebar(df: pd.DataFrame) -> Dict[str, Optional[str]]:\n    \"\"\"\n    Render column mapping UI in Streamlit sidebar expander.\n    Stores and returns active mappings in st.session_state.\n    \"\"\"\n    if \"column_mapping\" not in st.session_state:\n        st.session_state.column_mapping = auto_suggest_mappings(df.columns.tolist())\n\n    raw_cols = [\"-- Unmapped --\"] + df.columns.tolist()\n\n    with st.sidebar.expander(\"Dataset Column Mapping\", expanded=False):\n        st.caption(\"Map raw dataset columns to CarScope canonical fields:\")\n        \n        current_map = {}\n        for field, info in CANONICAL_FIELDS.items():\n            suggested = st.session_state.column_mapping.get(field)\n            default_index = raw_cols.index(suggested) if suggested in raw_cols else 0\n            \n            selected = st.selectbox(\n                f\"{info['label']} {'*' if info['required'] else ''}\",\n                options=raw_cols,\n                index=default_index,\n                key=f\"map_select_{field}\"\n            )\n            \n            current_map[field] = None if selected == \"-- Unmapped --\" else selected\n            \n        st.session_state.column_mapping = current_map\n        \n        if st.button(\"Auto-Detect Aliases\", use_container_width=True):\n            st.session_state.column_mapping = auto_suggest_mappings(df.columns.tolist())\n            st.rerun()\n\n    return st.session_state.column_mapping\n", "src/cleaning.py": "\"\"\"\nData cleaning and transformation module for CarScope.\nApplies Pandas transformations defensively, parses messy text/numeric fields,\ndetects duplicates and outliers, and constructs canonical DataFrames.\n\"\"\"\n\nfrom typing import Dict, Optional, Tuple, Any\nimport pandas as pd\nimport numpy as np\nimport re\nfrom datetime import datetime\n\n\ndef extract_numeric(val: Any) -> Optional[float]:\n    \"\"\"\n    Safely extract numeric values from strings containing currency, units, or formatting commas.\n    Examples: '$24,500' -> 24500.0, '-$5,000' -> -5000.0, '31,000 mi' -> 31000.0, '2.0 L' -> 2.0, '150 hp' -> 150.0\n    \"\"\"\n    if pd.isna(val) or val is None:\n        return np.nan\n    if isinstance(val, (int, float)):\n        return float(val)\n\n    s = str(val).strip()\n    \n    # Check if there is a negative sign before the first digit\n    is_negative = False\n    digit_match = re.search(r\"\\d\", s)\n    if \"-\" in s and digit_match and s.find(\"-\") < digit_match.start():\n        is_negative = True\n\n    match = re.search(r\"\\d[\\d,]*\\.?\\d*\", s)\n    if match:\n        clean_str = match.group(0).replace(\",\", \"\")\n        try:\n            num = float(clean_str)\n            return -num if is_negative else num\n        except ValueError:\n            return np.nan\n    return np.nan\n\n\ndef standardize_text(val: Any) -> Optional[str]:\n    \"\"\"\n    Standardize text category string by trimming and preserving proper title casing.\n    \"\"\"\n    if pd.isna(val) or val is None:\n        return np.nan\n    s = str(val).strip()\n    if not s or s.lower() in [\"nan\", \"none\", \"null\", \"n/a\", \"unknown\"]:\n        return np.nan\n    # Retain standard capitalization (Title case for brand/model/transmission/fuel)\n    return \" \".join([word.capitalize() for word in s.split()])\n\n\ndef clean_dataset(\n    raw_df: pd.DataFrame,\n    col_mapping: Dict[str, Optional[str]],\n    drop_duplicates_flag: bool = False,\n    exclude_missing_canonical: bool = False\n) -> Tuple[pd.DataFrame, Dict[str, Any]]:\n    \"\"\"\n    Clean raw DataFrame according to column mappings and data hygiene rules.\n\n    Returns:\n        Tuple of (cleaned_df: pd.DataFrame, cleaning_report: Dict[str, Any])\n    \"\"\"\n    # Create an explicit unmutated copy of the mapped fields\n    df = pd.DataFrame()\n    report = {\n        \"raw_rows\": len(raw_df),\n        \"exact_duplicates\": int(raw_df.duplicated().sum()),\n        \"removed_duplicates\": 0,\n        \"flagged_outliers\": 0,\n        \"outlier_details\": [],\n        \"missing_counts\": {},\n        \"failed_parses\": {}\n    }\n\n    # Map raw columns to canonical fields\n    for field, raw_col in col_mapping.items():\n        if raw_col and raw_col in raw_df.columns:\n            df[field] = raw_df[raw_col].copy()\n        else:\n            df[field] = np.nan\n\n    # 1. Parse Numeric Fields\n    numeric_fields = [\"year\", \"price\", \"mileage\", \"engine_size\", \"horsepower\", \"mpg\"]\n    for field in numeric_fields:\n        if field in df.columns and not df[field].isna().all():\n            original_series = df[field].copy()\n            df[field] = df[field].apply(extract_numeric)\n            failed_count = original_series.notna().sum() - df[field].notna().sum()\n            report[\"failed_parses\"][field] = int(failed_count)\n\n    # Convert year to integer where non-null\n    if \"year\" in df.columns:\n        df[\"year\"] = pd.to_numeric(df[\"year\"], errors=\"coerce\")\n\n    # 2. Standardize Categorical Fields\n    text_fields = [\"make\", \"model\", \"fuel_type\", \"transmission\", \"body_type\", \"condition\", \"location\"]\n    for field in text_fields:\n        if field in df.columns:\n            df[field] = df[field].apply(standardize_text)\n\n    # 3. Handle Duplicates\n    if drop_duplicates_flag:\n        initial_len = len(df)\n        df = df.drop_duplicates().copy()\n        report[\"removed_duplicates\"] = initial_len - len(df)\n\n    # 4. Flag Impossible / Suspicious Outliers\n    current_year = datetime.now().year\n    outlier_mask = pd.Series(False, index=df.index)\n\n    if \"price\" in df.columns:\n        invalid_price = (df[\"price\"] < 0) | (df[\"price\"] > 10_000_000)\n        if invalid_price.any():\n            outlier_mask |= invalid_price\n            report[\"outlier_details\"].append(f\"Price out of range (0 to $10M): {invalid_price.sum()} rows\")\n\n    if \"mileage\" in df.columns:\n        invalid_mileage = (df[\"mileage\"] < 0) | (df[\"mileage\"] > 2_000_000)\n        if invalid_mileage.any():\n            outlier_mask |= invalid_mileage\n            report[\"outlier_details\"].append(f\"Mileage out of range (0 to 2M): {invalid_mileage.sum()} rows\")\n\n    if \"year\" in df.columns:\n        invalid_year = (df[\"year\"] < 1900) | (df[\"year\"] > current_year + 1)\n        if invalid_year.any():\n            outlier_mask |= invalid_year\n            report[\"outlier_details\"].append(f\"Year out of range (1900 to {current_year + 1}): {invalid_year.sum()} rows\")\n\n    report[\"flagged_outliers\"] = int(outlier_mask.sum())\n    df[\"is_outlier\"] = outlier_mask\n\n    # 5. Missing Values Summary\n    report[\"missing_counts\"] = df.isna().sum().to_dict()\n\n    # Optional dropping of rows missing mandatory canonical fields (Make and Model)\n    if exclude_missing_canonical:\n        initial_cnt = len(df)\n        df = df.dropna(subset=[\"make\", \"model\"]).copy()\n        report[\"dropped_missing_canonical\"] = initial_cnt - len(df)\n\n    # 6. Generate Stable Unique Row Identifier (car_id)\n    # Allows unambiguous vehicle selection even when display names overlap\n    car_ids = []\n    for idx, row in df.iterrows():\n        make_str = str(row[\"make\"]) if pd.notna(row[\"make\"]) else \"Unknown Make\"\n        model_str = str(row[\"model\"]) if pd.notna(row[\"model\"]) else \"Unknown Model\"\n        year_str = str(int(row[\"year\"])) if pd.notna(row[\"year\"]) else \"N/A\"\n        car_ids.append(f\"{make_str} {model_str} ({year_str}) [#{idx}]\")\n    df[\"car_id\"] = car_ids\n\n    report[\"cleaned_rows\"] = len(df)\n    return df, report\n", "src/analytics.py": "\"\"\"\nAnalytics and Aggregation module for CarScope.\nDefensively calculates summary KPIs, grouped metrics, correlations,\nand vehicle comparative normalization using Pandas.\n\"\"\"\n\nfrom typing import Dict, Any, List, Optional, Tuple\nimport pandas as pd\nimport numpy as np\n\n\ndef compute_overview_kpis(df: pd.DataFrame) -> Dict[str, Any]:\n    \"\"\"\n    Calculate summary statistics for KPI cards.\n    Handles empty DataFrames and missing numeric columns gracefully.\n    \"\"\"\n    if df.empty:\n        return {\n            \"total_vehicles\": 0,\n            \"unique_makes\": 0,\n            \"mean_price\": None,\n            \"median_price\": None,\n            \"mean_mileage\": None,\n            \"year_min\": None,\n            \"year_max\": None,\n        }\n\n    total_vehicles = len(df)\n    unique_makes = df[\"make\"].nunique(dropna=True) if \"make\" in df.columns else 0\n\n    mean_price = df[\"price\"].mean() if \"price\" in df.columns and df[\"price\"].notna().any() else None\n    median_price = df[\"price\"].median() if \"price\" in df.columns and df[\"price\"].notna().any() else None\n    mean_mileage = df[\"mileage\"].mean() if \"mileage\" in df.columns and df[\"mileage\"].notna().any() else None\n\n    year_min, year_max = None, None\n    if \"year\" in df.columns and df[\"year\"].notna().any():\n        year_min = int(df[\"year\"].min())\n        year_max = int(df[\"year\"].max())\n\n    return {\n        \"total_vehicles\": total_vehicles,\n        \"unique_makes\": unique_makes,\n        \"mean_price\": round(mean_price, 2) if mean_price is not None and not np.isnan(mean_price) else None,\n        \"median_price\": round(median_price, 2) if median_price is not None and not np.isnan(median_price) else None,\n        \"mean_mileage\": round(mean_mileage, 0) if mean_mileage is not None and not np.isnan(mean_mileage) else None,\n        \"year_min\": year_min,\n        \"year_max\": year_max,\n    }\n\n\ndef compute_top_makes(df: pd.DataFrame, top_n: int = 10) -> pd.DataFrame:\n    \"\"\"\n    Return top N makes ordered by listing count.\n    \"\"\"\n    if df.empty or \"make\" not in df.columns:\n        return pd.DataFrame(columns=[\"make\", \"count\"])\n\n    counts = df[\"make\"].value_counts().reset_index()\n    counts.columns = [\"make\", \"count\"]\n    return counts.head(top_n)\n\n\ndef compute_price_by_make(df: pd.DataFrame, min_group_size: int = 2) -> pd.DataFrame:\n    \"\"\"\n    Compute mean and median price by make, filtering out small sample groups.\n    \"\"\"\n    if df.empty or \"make\" not in df.columns or \"price\" not in df.columns:\n        return pd.DataFrame(columns=[\"make\", \"mean_price\", \"median_price\", \"count\"])\n\n    valid = df.dropna(subset=[\"make\", \"price\"])\n    if valid.empty:\n        return pd.DataFrame(columns=[\"make\", \"mean_price\", \"median_price\", \"count\"])\n\n    grouped = (\n        valid.groupby(\"make\")[\"price\"]\n        .agg([\"mean\", \"median\", \"count\"])\n        .reset_index()\n    )\n    grouped.rename(columns={\"mean\": \"mean_price\", \"median\": \"median_price\"}, inplace=True)\n    \n    # Filter by minimum sample threshold\n    filtered = grouped[grouped[\"count\"] >= min_group_size].sort_values(\"median_price\", ascending=False)\n    return filtered\n\n\ndef compute_price_vs_year(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Compute mean and median price per vehicle production year.\n    \"\"\"\n    if df.empty or \"year\" not in df.columns or \"price\" not in df.columns:\n        return pd.DataFrame(columns=[\"year\", \"mean_price\", \"median_price\", \"count\"])\n\n    valid = df.dropna(subset=[\"year\", \"price\"])\n    if valid.empty:\n        return pd.DataFrame(columns=[\"year\", \"mean_price\", \"median_price\", \"count\"])\n\n    grouped = (\n        valid.groupby(\"year\")[\"price\"]\n        .agg([\"mean\", \"median\", \"count\"])\n        .reset_index()\n    )\n    grouped.rename(columns={\"mean\": \"mean_price\", \"median\": \"median_price\"}, inplace=True)\n    return grouped.sort_values(\"year\")\n\n\ndef compute_correlation_matrix(\n    df: pd.DataFrame,\n    selected_cols: List[str],\n    method: str = \"pearson\"\n) -> Tuple[pd.DataFrame, List[str]]:\n    \"\"\"\n    Compute correlation matrix for selected numeric columns.\n    Omits constant columns or columns with insufficient paired data.\n\n    Returns:\n        Tuple of (corr_df: pd.DataFrame, valid_numeric_cols: List[str])\n    \"\"\"\n    valid_cols = []\n    for col in selected_cols:\n        if col in df.columns and pd.api.types.is_numeric_dtype(df[col]):\n            # Verify column is non-constant and has non-null entries\n            non_null = df[col].dropna()\n            if len(non_null) > 1 and non_null.nunique() > 1:\n                valid_cols.append(col)\n\n    if len(valid_cols) < 2:\n        return pd.DataFrame(), valid_cols\n\n    corr_df = df[valid_cols].corr(method=method)\n    return corr_df, valid_cols\n\n\ndef compute_car_comparison(df: pd.DataFrame, selected_car_ids: List[str]) -> Tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"\n    Extract side-by-side comparative table for selected car IDs and calculate\n    0-to-1 min-max normalized metric scores for multi-attribute comparison plotting.\n\n    Returns:\n        Tuple of (raw_specs_df: pd.DataFrame, normalized_df: pd.DataFrame)\n    \"\"\"\n    if df.empty or not selected_car_ids or \"car_id\" not in df.columns:\n        return pd.DataFrame(), pd.DataFrame()\n\n    selected_df = df[df[\"car_id\"].isin(selected_car_ids)].copy()\n    if selected_df.empty:\n        return pd.DataFrame(), pd.DataFrame()\n\n    # Raw Specs Table formatted as clean string representations\n    cols_to_show = [\"car_id\", \"make\", \"model\", \"year\", \"price\", \"mileage\", \"horsepower\", \"engine_size\", \"fuel_type\", \"transmission\", \"mpg\"]\n    avail_cols = [c for c in cols_to_show if c in selected_df.columns]\n    formatted_df = selected_df[avail_cols].copy()\n    for col in avail_cols:\n        if col == \"price\":\n            formatted_df[col] = formatted_df[col].apply(lambda x: f\"${x:,.0f}\" if pd.notna(x) else \"N/A\")\n        elif col == \"mileage\":\n            formatted_df[col] = formatted_df[col].apply(lambda x: f\"{x:,.0f} mi\" if pd.notna(x) else \"N/A\")\n        elif col in [\"year\", \"horsepower\", \"mpg\"]:\n            formatted_df[col] = formatted_df[col].apply(lambda x: f\"{int(x)}\" if pd.notna(x) else \"N/A\")\n        elif col == \"engine_size\":\n            formatted_df[col] = formatted_df[col].apply(lambda x: f\"{x:.1f} L\" if pd.notna(x) else \"N/A\")\n        else:\n            formatted_df[col] = formatted_df[col].astype(str)\n\n    raw_specs = formatted_df.set_index(\"car_id\").T\n\n    # Calculate Min-Max Normalization (0.0 to 1.0) across selected numeric metrics\n    numeric_metrics = [\"price\", \"mileage\", \"horsepower\", \"engine_size\", \"mpg\", \"year\"]\n    avail_metrics = [m for m in numeric_metrics if m in selected_df.columns and selected_df[m].notna().any()]\n\n    normalized_records = []\n    for metric in avail_metrics:\n        s = selected_df[metric].astype(float)\n        min_val = s.min()\n        max_val = s.max()\n        val_range = max_val - min_val\n\n        for car_id, val in zip(selected_df[\"car_id\"], s):\n            if pd.isna(val):\n                norm_score = np.nan\n            elif val_range == 0:\n                norm_score = 0.5  # Constant value baseline\n            else:\n                norm_score = (val - min_val) / val_range\n\n            normalized_records.append({\n                \"car_id\": car_id,\n                \"metric\": metric.replace(\"_\", \" \").title(),\n                \"raw_value\": val,\n                \"normalized_score\": norm_score\n            })\n\n    normalized_df = pd.DataFrame(normalized_records)\n    return raw_specs, normalized_df\n", "src/charts.py": "\"\"\"\nVisualization module for CarScope.\nGenerates Seaborn and Matplotlib figures styled in a clean light-mode theme.\nEnsures memory management by closing figures after Streamlit rendering.\n\"\"\"\n\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport pandas as pd\nimport numpy as np\nfrom typing import Optional, List\nfrom src.ui import (\n    COLOR_BACKGROUND, COLOR_SURFACE, COLOR_BORDER,\n    COLOR_TEXT_PRIMARY, COLOR_TEXT_SECONDARY,\n    COLOR_PRIMARY, COLOR_SECONDARY, COLOR_POSITIVE,\n    COLOR_WARNING, COLOR_DANGER, CHART_PALETTE\n)\n\n\ndef apply_chart_style(fig: plt.Figure, ax: plt.Axes):\n    \"\"\"\n    Apply clean light-mode styling to Matplotlib figure and axes without line clutter.\n    \"\"\"\n    fig.patch.set_facecolor(COLOR_SURFACE)\n    ax.set_facecolor(COLOR_SURFACE)\n\n    # Remove top and right spines to reduce line clutter\n    ax.spines[\"top\"].set_visible(False)\n    ax.spines[\"right\"].set_visible(False)\n    ax.spines[\"left\"].set_color(\"#CBD5E1\")\n    ax.spines[\"bottom\"].set_color(\"#CBD5E1\")\n\n    # Ticks and tick labels\n    ax.tick_params(colors=COLOR_TEXT_SECONDARY, labelsize=10)\n    ax.xaxis.label.set_color(COLOR_TEXT_PRIMARY)\n    ax.yaxis.label.set_color(COLOR_TEXT_PRIMARY)\n    ax.xaxis.label.set_size(11)\n    ax.yaxis.label.set_size(11)\n    ax.title.set_color(COLOR_TEXT_PRIMARY)\n    ax.title.set_size(13)\n    ax.title.set_weight(\"bold\")\n\n    # Subtle gridlines\n    ax.grid(True, color=\"#F1F5F9\", linestyle=\"--\", alpha=0.7)\n\n\ndef plot_top_makes(df: pd.DataFrame, top_n: int = 10) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn horizontal bar plot of top vehicle makes by listing count.\n    \"\"\"\n    if df.empty or \"make\" not in df.columns:\n        return None\n\n    counts = df[\"make\"].value_counts().head(top_n).reset_index()\n    counts.columns = [\"make\", \"count\"]\n\n    fig, ax = plt.subplots(figsize=(8, 4.5))\n    apply_chart_style(fig, ax)\n\n    sns.barplot(\n        data=counts,\n        y=\"make\",\n        x=\"count\",\n        hue=\"make\",\n        legend=False,\n        ax=ax,\n        palette=[COLOR_PRIMARY] * len(counts),\n        edgecolor=COLOR_BORDER\n    )\n\n    ax.set_title(f\"Top {top_n} Makes by Listing Volume\", pad=12)\n    ax.set_xlabel(\"Number of Listings\")\n    ax.set_ylabel(\"Make\")\n\n    # Value annotations on bars\n    for p in ax.patches:\n        width = p.get_width()\n        ax.annotate(\n            f\"{int(width):,}\",\n            (width, p.get_y() + p.get_height() / 2.0),\n            ha=\"left\", va=\"center\",\n            xytext=(6, 0),\n            textcoords=\"offset points\",\n            color=COLOR_TEXT_PRIMARY,\n            fontsize=9.5,\n            weight=\"bold\"\n        )\n\n    ax.set_xlim(0, counts[\"count\"].max() * 1.15)\n    plt.tight_layout()\n    return fig\n\n\ndef plot_price_distribution(df: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Matplotlib histogram with optional Seaborn KDE curve and mean/median markers.\n    \"\"\"\n    if df.empty or \"price\" not in df.columns:\n        return None\n\n    valid = df[\"price\"].dropna()\n    if valid.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(8, 4.5))\n    apply_chart_style(fig, ax)\n\n    sns.histplot(\n        valid,\n        kde=True,\n        ax=ax,\n        color=COLOR_PRIMARY,\n        edgecolor=COLOR_BORDER,\n        alpha=0.6,\n        line_kws={\"color\": COLOR_SECONDARY, \"linewidth\": 2.5}\n    )\n\n    mean_val = valid.mean()\n    median_val = valid.median()\n\n    ax.axvline(mean_val, color=COLOR_DANGER, linestyle=\"--\", linewidth=2, label=f\"Mean: ${mean_val:,.0f}\")\n    ax.axvline(median_val, color=COLOR_POSITIVE, linestyle=\"-\", linewidth=2, label=f\"Median: ${median_val:,.0f}\")\n\n    ax.set_title(\"Price Distribution & Density Estimation\", pad=12)\n    ax.set_xlabel(\"Price ($)\")\n    ax.set_ylabel(\"Frequency / Count\")\n    ax.legend(facecolor=COLOR_SURFACE, edgecolor=COLOR_BORDER, labelcolor=COLOR_TEXT_PRIMARY)\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_year_distribution(df: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Matplotlib/Seaborn distribution plot of vehicle manufacture years.\n    \"\"\"\n    if df.empty or \"year\" not in df.columns:\n        return None\n\n    valid = df[\"year\"].dropna()\n    if valid.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(8, 4.5))\n    apply_chart_style(fig, ax)\n\n    sns.histplot(\n        valid,\n        discrete=True,\n        ax=ax,\n        color=COLOR_SECONDARY,\n        edgecolor=COLOR_BORDER,\n        alpha=0.8\n    )\n\n    ax.set_title(\"Vehicle Distribution by Model Year\", pad=12)\n    ax.set_xlabel(\"Model Year\")\n    ax.set_ylabel(\"Count\")\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_price_by_make(df_price_by_make: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn horizontal bar chart comparing mean vs median price by make.\n    \"\"\"\n    if df_price_by_make.empty:\n        return None\n\n    top_df = df_price_by_make.head(12)\n\n    fig, ax = plt.subplots(figsize=(9, 5.5))\n    apply_chart_style(fig, ax)\n\n    y_indices = np.arange(len(top_df))\n    bar_height = 0.38\n\n    ax.barh(y_indices - bar_height / 2, top_df[\"median_price\"], height=bar_height, label=\"Median Price\", color=COLOR_PRIMARY, edgecolor=COLOR_BORDER)\n    ax.barh(y_indices + bar_height / 2, top_df[\"mean_price\"], height=bar_height, label=\"Mean Price\", color=COLOR_SECONDARY, edgecolor=COLOR_BORDER, alpha=0.7)\n\n    ax.set_yticks(y_indices)\n    ax.set_yticklabels(top_df[\"make\"])\n    ax.invert_yaxis()\n\n    ax.set_title(\"Mean vs. Median Price by Make\", pad=12)\n    ax.set_xlabel(\"Price ($)\")\n    ax.legend(facecolor=COLOR_SURFACE, edgecolor=COLOR_BORDER, labelcolor=COLOR_TEXT_PRIMARY)\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_price_vs_year(df_price_vs_year: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Matplotlib line plot illustrating average and median price progression over years.\n    \"\"\"\n    if df_price_vs_year.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(9, 4.8))\n    apply_chart_style(fig, ax)\n\n    ax.plot(df_price_vs_year[\"year\"], df_price_vs_year[\"median_price\"], marker=\"o\", color=COLOR_PRIMARY, linewidth=2.5, label=\"Median Price\")\n    ax.plot(df_price_vs_year[\"year\"], df_price_vs_year[\"mean_price\"], marker=\"s\", color=COLOR_SECONDARY, linewidth=2.0, linestyle=\"--\", label=\"Mean Price\")\n\n    ax.set_title(\"Vehicle Price Progression by Production Year\", pad=12)\n    ax.set_xlabel(\"Production Year\")\n    ax.set_ylabel(\"Price ($)\")\n    ax.legend(facecolor=COLOR_SURFACE, edgecolor=COLOR_BORDER, labelcolor=COLOR_TEXT_PRIMARY)\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_price_vs_mileage(df: pd.DataFrame, show_regression: bool = True) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn scatter plot of Price vs. Mileage with linear regression option.\n    \"\"\"\n    if df.empty or \"price\" not in df.columns or \"mileage\" not in df.columns:\n        return None\n\n    valid = df.dropna(subset=[\"price\", \"mileage\"])\n    if valid.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(8.5, 5))\n    apply_chart_style(fig, ax)\n\n    if show_regression:\n        sns.regplot(\n            data=valid,\n            x=\"mileage\",\n            y=\"price\",\n            ax=ax,\n            scatter_kws={\"color\": COLOR_PRIMARY, \"alpha\": 0.6, \"s\": 35},\n            line_kws={\"color\": COLOR_DANGER, \"linewidth\": 2}\n        )\n    else:\n        sns.scatterplot(\n            data=valid,\n            x=\"mileage\",\n            y=\"price\",\n            ax=ax,\n            color=COLOR_PRIMARY,\n            alpha=0.6,\n            s=35\n        )\n\n    corr_val = valid[\"price\"].corr(valid[\"mileage\"])\n    if pd.notna(corr_val):\n        ax.text(\n            0.95, 0.92,\n            f\"Pearson r = {corr_val:.2f}\",\n            transform=ax.transAxes,\n            ha=\"right\", va=\"top\",\n            bbox=dict(boxstyle=\"round,pad=0.4\", facecolor=COLOR_SURFACE, edgecolor=COLOR_BORDER),\n            color=COLOR_TEXT_PRIMARY,\n            fontsize=10, weight=\"bold\"\n        )\n\n    ax.set_title(\"Vehicle Price vs. Mileage\", pad=12)\n    ax.set_xlabel(\"Mileage\")\n    ax.set_ylabel(\"Price ($)\")\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_price_by_category(df: pd.DataFrame, category_col: str) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn boxplot illustrating price distributions across categorical segments.\n    \"\"\"\n    if df.empty or \"price\" not in df.columns or category_col not in df.columns:\n        return None\n\n    valid = df.dropna(subset=[\"price\", category_col])\n    if valid.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(8.5, 5))\n    apply_chart_style(fig, ax)\n\n    n_cats = valid[category_col].nunique()\n    palette_use = (CHART_PALETTE * ((n_cats // len(CHART_PALETTE)) + 1))[:n_cats]\n\n    sns.boxplot(\n        data=valid,\n        x=category_col,\n        y=\"price\",\n        hue=category_col,\n        legend=False,\n        ax=ax,\n        palette=palette_use,\n        boxprops=dict(edgecolor=COLOR_TEXT_PRIMARY),\n        medianprops=dict(color=COLOR_TEXT_PRIMARY, linewidth=2.5),\n        flierprops=dict(marker=\"o\", color=COLOR_DANGER, alpha=0.5)\n    )\n\n    ax.set_title(f\"Price Distribution by {category_col.replace('_', ' ').title()}\", pad=12)\n    ax.set_xlabel(category_col.replace('_', ' ').title())\n    ax.set_ylabel(\"Price ($)\")\n    plt.xticks(rotation=15)\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_car_comparison_normalized(normalized_df: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn horizontal grouped bar chart showing 0-to-1 min-max normalized scores.\n    \"\"\"\n    if normalized_df.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(9, 5.5))\n    apply_chart_style(fig, ax)\n\n    n_cars = normalized_df[\"car_id\"].nunique()\n    palette_use = (CHART_PALETTE * ((n_cars // len(CHART_PALETTE)) + 1))[:n_cars]\n\n    sns.barplot(\n        data=normalized_df,\n        y=\"metric\",\n        x=\"normalized_score\",\n        hue=\"car_id\",\n        ax=ax,\n        palette=palette_use,\n        edgecolor=COLOR_BORDER\n    )\n\n    ax.set_title(\"Normalized Metric Comparison (0.0 = Min, 1.0 = Max in Selection)\", pad=12)\n    ax.set_xlabel(\"Relative Score (Min-Max Scaled)\")\n    ax.set_ylabel(\"Metric\")\n    ax.set_xlim(0, 1.1)\n\n    ax.legend(\n        facecolor=COLOR_SURFACE,\n        edgecolor=COLOR_BORDER,\n        labelcolor=COLOR_TEXT_PRIMARY,\n        title=\"Vehicle\",\n        bbox_to_anchor=(1.05, 1),\n        loc=\"upper left\"\n    )\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_correlation_heatmap(corr_df: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render Seaborn correlation heatmap centered at zero using a clean palette.\n    \"\"\"\n    if corr_df.empty:\n        return None\n\n    fig, ax = plt.subplots(figsize=(7.5, 6))\n    apply_chart_style(fig, ax)\n\n    sns.heatmap(\n        corr_df,\n        annot=True,\n        fmt=\".2f\",\n        cmap=\"Blues\",\n        center=0,\n        vmin=-1.0,\n        vmax=1.0,\n        ax=ax,\n        cbar_kws={\"label\": \"Correlation Coefficient\"},\n        square=True,\n        linewidths=1,\n        linecolor=COLOR_BORDER\n    )\n\n    ax.set_title(\"Numeric Variable Correlation Matrix\", pad=12)\n    plt.xticks(rotation=45, ha=\"right\")\n    plt.yticks(rotation=0)\n\n    plt.tight_layout()\n    return fig\n\n\ndef plot_missingness(df: pd.DataFrame) -> Optional[plt.Figure]:\n    \"\"\"\n    Render horizontal bar plot showing missing cell percentage per canonical field.\n    \"\"\"\n    if df.empty:\n        return None\n\n    missing_pct = (df.isna().sum() / len(df) * 100).sort_values(ascending=True)\n    missing_df = missing_pct.reset_index()\n    missing_df.columns = [\"field\", \"missing_pct\"]\n\n    fig, ax = plt.subplots(figsize=(8, 4.5))\n    apply_chart_style(fig, ax)\n\n    sns.barplot(\n        data=missing_df,\n        y=\"field\",\n        x=\"missing_pct\",\n        hue=\"field\",\n        legend=False,\n        ax=ax,\n        palette=[COLOR_WARNING if p > 0 else COLOR_PRIMARY for p in missing_df[\"missing_pct\"]],\n        edgecolor=COLOR_BORDER\n    )\n\n    ax.set_title(\"Missing Data Percentage by Field\", pad=12)\n    ax.set_xlabel(\"Missing Percentage (%)\")\n    ax.set_ylabel(\"Canonical Field\")\n    ax.set_xlim(0, max(100, missing_df[\"missing_pct\"].max() * 1.15))\n\n    for p in ax.patches:\n        width = p.get_width()\n        ax.annotate(\n            f\"{width:.1f}%\",\n            (width, p.get_y() + p.get_height() / 2.0),\n            ha=\"left\", va=\"center\",\n            xytext=(6, 0),\n            textcoords=\"offset points\",\n            color=COLOR_TEXT_PRIMARY,\n            fontsize=9.5\n        )\n\n    plt.tight_layout()\n    return fig\n", "src/filters.py": "\"\"\"\nInteractive filter controls module for CarScope.\nGenerates Streamlit sidebar filter widgets and defensively filters\nworking DataFrames using Pandas.\n\"\"\"\n\nfrom typing import Dict, Any\nimport streamlit as st\nimport pandas as pd\nimport numpy as np\n\n\ndef render_sidebar_filters(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Render interactive filter controls in Streamlit sidebar and apply\n    the filter criteria to derive a filtered DataFrame.\n    \"\"\"\n    if df.empty:\n        return df\n\n    st.sidebar.markdown(\"### Global Filters\")\n\n    if st.sidebar.button(\"Reset All Filters\", use_container_width=True):\n        for key in list(st.session_state.keys()):\n            if key.startswith(\"filter_\"):\n                del st.session_state[key]\n        st.rerun()\n\n    filtered_df = df.copy()\n\n    # 1. Make Filter\n    if \"make\" in df.columns and df[\"make\"].notna().any():\n        all_makes = sorted(df[\"make\"].dropna().unique().tolist())\n        selected_makes = st.sidebar.multiselect(\n            \"Make / Brand\",\n            options=all_makes,\n            default=[],\n            key=\"filter_make\",\n            help=\"Select one or more vehicle brands\"\n        )\n        if selected_makes:\n            filtered_df = filtered_df[filtered_df[\"make\"].isin(selected_makes)]\n\n    # 2. Model Filter (Dependent on selected makes)\n    if \"model\" in filtered_df.columns and filtered_df[\"model\"].notna().any():\n        all_models = sorted(filtered_df[\"model\"].dropna().unique().tolist())\n        selected_models = st.sidebar.multiselect(\n            \"Model\",\n            options=all_models,\n            default=[],\n            key=\"filter_model\",\n            help=\"Select specific vehicle models\"\n        )\n        if selected_models:\n            filtered_df = filtered_df[filtered_df[\"model\"].isin(selected_models)]\n\n    # 3. Year Range Slider\n    if \"year\" in df.columns and df[\"year\"].notna().any():\n        valid_years = df[\"year\"].dropna().astype(int)\n        min_yr = int(valid_years.min())\n        max_yr = int(valid_years.max())\n\n        if min_yr < max_yr:\n            year_range = st.sidebar.slider(\n                \"Model Year\",\n                min_value=min_yr,\n                max_value=max_yr,\n                value=(min_yr, max_yr),\n                key=\"filter_year\"\n            )\n            filtered_df = filtered_df[\n                (filtered_df[\"year\"].isna()) |\n                ((filtered_df[\"year\"] >= year_range[0]) & (filtered_df[\"year\"] <= year_range[1]))\n            ]\n\n    # 4. Price Range Slider\n    if \"price\" in df.columns and df[\"price\"].notna().any():\n        valid_prices = df[\"price\"].dropna()\n        min_p = float(valid_prices.min())\n        max_p = float(valid_prices.max())\n\n        if min_p < max_p:\n            price_range = st.sidebar.slider(\n                \"Price ($)\",\n                min_value=float(min_p),\n                max_value=float(max_p),\n                value=(float(min_p), float(max_p)),\n                format=\"$%.0f\",\n                key=\"filter_price\"\n            )\n            filtered_df = filtered_df[\n                (filtered_df[\"price\"].isna()) |\n                ((filtered_df[\"price\"] >= price_range[0]) & (filtered_df[\"price\"] <= price_range[1]))\n            ]\n\n    # 5. Mileage Range Slider\n    if \"mileage\" in df.columns and df[\"mileage\"].notna().any():\n        valid_miles = df[\"mileage\"].dropna()\n        min_m = float(valid_miles.min())\n        max_m = float(valid_miles.max())\n\n        if min_m < max_m:\n            mileage_range = st.sidebar.slider(\n                \"Mileage\",\n                min_value=float(min_m),\n                max_value=float(max_m),\n                value=(float(min_m), float(max_m)),\n                key=\"filter_mileage\"\n            )\n            filtered_df = filtered_df[\n                (filtered_df[\"mileage\"].isna()) |\n                ((filtered_df[\"mileage\"] >= mileage_range[0]) & (filtered_df[\"mileage\"] <= mileage_range[1]))\n            ]\n\n    # 6. Fuel Type Multiselect\n    if \"fuel_type\" in df.columns and df[\"fuel_type\"].notna().any():\n        fuels = sorted(df[\"fuel_type\"].dropna().unique().tolist())\n        selected_fuels = st.sidebar.multiselect(\n            \"Fuel Type\",\n            options=fuels,\n            default=[],\n            key=\"filter_fuel\"\n        )\n        if selected_fuels:\n            filtered_df = filtered_df[filtered_df[\"fuel_type\"].isin(selected_fuels)]\n\n    # 7. Transmission Multiselect\n    if \"transmission\" in df.columns and df[\"transmission\"].notna().any():\n        transmissions = sorted(df[\"transmission\"].dropna().unique().tolist())\n        selected_trans = st.sidebar.multiselect(\n            \"Transmission\",\n            options=transmissions,\n            default=[],\n            key=\"filter_transmission\"\n        )\n        if selected_trans:\n            filtered_df = filtered_df[filtered_df[\"transmission\"].isin(selected_trans)]\n\n    return fi
